name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - name: Connector tests and static analysis
        run: cd connector && go test ./... && go vet ./...
      - name: Connector race detector
        run: cd connector && go test -race ./...
      - name: Compile Linux binaries
        run: bash scripts/build-linux.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - name: Connector and installer build
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Package unsigned Windows preview
        shell: pwsh
        run: ./scripts/package-preview.ps1
      - name: Retain Windows preview for validation
        uses: actions/upload-artifact@v7
        with:
          name: sloth-mode-windows-preview
          path: build/preview/
          if-no-files-found: error
          retention-days: 14
  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Account service tests
        run: cd cloud && node --test account.test.mjs
