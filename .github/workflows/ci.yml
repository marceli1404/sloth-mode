name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - name: Connector tests and static analysis
        run: cd connector && go test ./... && go vet ./...
      - name: Connector race detector
        run: cd connector && go test -race ./...
      - name: Compile Linux binaries
        run: bash scripts/build-linux.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - name: Connector and installer build
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Preview installer checksum
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $exe = 'build/SlothMode-Setup.exe'
          if (!(Test-Path $exe)) { throw 'Installer is missing' }
          $sha = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          "$sha *SlothMode-Setup.exe" | Set-Content -Encoding ascii 'build/SlothMode-Setup.exe.sha256'
      - name: Upload unsigned Windows preview installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: SlothMode-Windows-Preview
          path: |
            build/SlothMode-Setup.exe
            build/SlothMode-Setup.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Account service tests
        run: cd cloud && node --test account.test.mjs
      - name: Browser Gemma compatibility and UI tests
        run: node --test web/browser-ai.test.mjs
      - name: Unified workspace layout and routing tests
        run: node --test web/workspace.test.mjs
      - name: Cross-platform brand identity tests
        run: node --test web/brand.test.mjs
      - name: Public beta access and feedback tests
        run: node --test web/beta-launch.test.mjs
